<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ Code — Design System 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0E14;font-family:'IBM Plex Sans',sans-serif;min-height:100vh}

/* ─ Top switcher bar ─ */
.ds-bar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:rgba(8,10,16,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}
.ds-logo{display:flex;align-items:center;gap:9px}
.ds-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#1A5C38,#1A3F8A);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white}
.ds-name{font-size:14px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:-.2px}
.ds-tag{font-size:10px;color:rgba(255,255,255,.3);margin-left:4px}
.ds-tabs{display:flex;gap:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:3px}
.ds-tab{padding:7px 18px;border-radius:8px;font-size:11px;font-weight:500;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .2s;color:rgba(255,255,255,.4);background:transparent}
.ds-tab:hover{color:rgba(255,255,255,.7)}
.ds-tab.on{color:white;background:rgba(255,255,255,.1)}
.ds-info{font-size:10px;color:rgba(255,255,255,.25)}

.design{display:none;padding-top:54px}
.design.on{display:block}
.screen{display:none}
.screen.on{display:block}

/* ════ DESIGN 1 — WARM PROFESSIONAL (IBM Plex Sans) ═══ */
.d1{background:#F5F3EE;font-family:'IBM Plex Sans',sans-serif;
  --bg:#F5F3EE;--card:#FFF;--ink:#141210;--ink2:#44403C;--ink3:#8C8680;
  --green:#1A5C38;--green-l:#E8F2EC;--gold:#B07A28;--gold-l:#FAF1E0;
  --red:#B82A2A;--red-l:#FBEAEA;--blue:#1A3F8A;--blue-l:#E8EEF8;
  --amber:#A86018;--amber-l:#FDF0E0;--border:#DDD9D2;--r:12px}
.d1 .wrap{max-width:1300px;margin:0 auto;padding:22px 30px 44px}
.d1 .phdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.d1 .brand{display:flex;align-items:center;gap:10px}
.d1 .bmark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1A5C38,#1A3F8A);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white}
.d1 .bname{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.d1 .btag{font-size:9px;color:var(--ink3);margin-left:5px;background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase}
.d1 .npills{display:flex;gap:3px;background:white;border:1px solid var(--border);border-radius:9px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.d1 .np{padding:6px 13px;border-radius:7px;font-size:11px;font-weight:500;color:var(--ink3);background:transparent;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.d1 .np:hover{color:var(--ink);background:var(--bg)}
.d1 .np.on{color:var(--green);background:var(--green-l);font-weight:600}
.d1 .win{background:var(--bg);border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 16px 64px rgba(0,0,0,.09)}
.d1 .ab{height:48px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.d1 .abl{display:flex;align-items:center;gap:10px}
.d1 .abmark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#1A5C38,#1A3F8A);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:white}
.d1 .abn{font-size:13px;font-weight:600;color:var(--ink)}
.d1 .abco{font-size:11px;color:var(--ink3)}
.d1 .abr{display:flex;align-items:center;gap:10px}
.d1 .qp{font-size:10px;font-weight:600;color:var(--green);background:var(--green-l);border:1px solid rgba(26,92,56,.15);padding:3px 9px;border-radius:5px}
.d1 .dl-btn{font-size:10px;font-weight:500;color:var(--green);background:var(--green-l);border:1px solid rgba(26,92,56,.2);border-radius:5px;padding:3px 10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.d1 .sob{font-size:11px;color:var(--ink3);background:transparent;border:1px solid var(--border);border-radius:5px;padding:4px 11px;cursor:pointer;font-family:inherit}
.d1 .layout{display:grid;grid-template-columns:200px 1fr;min-height:660px}
.d1 .sb{background:white;border-right:1px solid var(--border);padding:18px 10px}
.d1 .sbl{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:0 8px;margin-bottom:5px;font-weight:600}
.d1 .si{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:11px;color:var(--ink2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:all .12s;margin-bottom:1px}
.d1 .si:hover{background:var(--bg);color:var(--ink)}
.d1 .si.on{background:var(--green-l);color:var(--green);font-weight:500}
.d1 .main{background:var(--bg);padding:22px 24px 32px}
.d1 .pgt{font-family:'IBM Plex Serif',serif;font-size:22px;color:var(--ink);margin-bottom:2px;font-weight:500;letter-spacing:-.3px}
.d1 .pgs{font-size:11px;color:var(--ink3);margin-bottom:18px}
.d1 .mr{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:11px}
.d1 .mc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 15px}
.d1 .ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:500}
.d1 .mv{font-size:21px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:2px}
.d1 .ms{font-size:9px;color:var(--ink3)}
.d1 .srow{display:grid;grid-template-columns:160px 1fr 215px;gap:10px;margin-bottom:11px}
.d1 .gc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d1 .gr{width:100px;height:100px;border-radius:50%;border:8px solid var(--amber);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:9px;box-shadow:0 0 0 2px var(--amber-l)}
.d1 .gp{font-size:25px;font-weight:700;color:var(--ink)}
.d1 .gl{font-size:9px;font-weight:600;color:var(--amber);letter-spacing:.05em;text-transform:uppercase}
.d1 .glb{font-size:10px;color:var(--ink3);text-align:center}
.d1 .scalec{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.d1 .sct{font-size:9px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;font-weight:600}
.d1 .scg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.d1 .sci{border-radius:7px;padding:7px 6px;text-align:center;border:1px solid transparent}
.d1 .scn{font-size:10px;font-weight:600}
.d1 .scr{font-size:8px;margin-top:2px;opacity:.65}
.d1 .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.d1 .sb2{background:var(--bg);border-radius:7px;padding:7px 9px;text-align:center}
.d1 .sbv{font-size:14px;font-weight:700;color:var(--ink)}
.d1 .sbl2{font-size:9px;color:var(--ink3);margin-top:2px}
.d1 .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.d1 .pc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.d1 .pc::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.d1 .p1::before{background:linear-gradient(90deg,#1A5C38,#1A3F8A)}
.d1 .p2::before{background:linear-gradient(90deg,#A86018,#1A5C38)}
.d1 .p3::before{background:linear-gradient(90deg,#1A3F8A,#A86018)}
.d1 .ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px;margin-top:4px}
.d1 .pn{font-size:11px;font-weight:600;color:var(--ink)}
.d1 .pw{font-size:9px;color:var(--ink3);margin-top:2px}
.d1 .ps{font-size:19px;font-weight:700;text-align:right}
.d1 .pb{font-size:8px;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:2px;display:inline-block;letter-spacing:.04em;text-transform:uppercase}
.d1 .subr{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
.d1 .sn{color:var(--ink3)}
.d1 .sv{font-weight:600;color:var(--ink2)}
.d1 .bt{height:3.5px;background:var(--bg);border-radius:2px;overflow:hidden;margin-bottom:8px}
.d1 .bf{height:100%;border-radius:2px}
.d1 .charts{display:grid;grid-template-columns:1fr 240px;gap:9px;margin-bottom:11px}
.d1 .chc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.d1 .cht{font-size:9px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.d1 .review-tag{font-size:8px;color:var(--blue);background:var(--blue-l);border:1px solid rgba(26,63,138,.15);padding:1px 6px;border-radius:3px;font-style:italic;margin-left:6px;letter-spacing:.02em;text-transform:none}
/* Financial impact */
.d1 .finloss{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:11px}
.d1 .fl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.d1 .fl-t{font-size:9px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.d1 .fl-total{font-size:11px;font-weight:700;color:var(--red)}
.d1 .fl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
.d1 .fl-card{background:var(--red-l);border:1px solid rgba(184,42,42,.12);border-radius:9px;padding:11px 13px}
.d1 .fl-card.amber{background:var(--amber-l);border-color:rgba(168,96,24,.12)}
.d1 .fl-card.blue{background:var(--blue-l);border-color:rgba(26,63,138,.12)}
.d1 .fl-lbl{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;font-weight:500}
.d1 .fl-val{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:2px}
.d1 .fl-sub{font-size:9px;color:var(--ink3);line-height:1.5}
.d1 .fl-insight{background:rgba(184,42,42,.05);border:1px solid rgba(184,42,42,.1);border-radius:8px;padding:10px 12px;font-size:10px;color:var(--ink2);line-height:1.6}
.d1 .fl-insight strong{color:var(--red)}
/* ESG bridge separate */
.d1 .esg-row{background:white;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:11px}
.d1 .esg-head{font-size:9px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:11px}
.d1 .esg-flow{display:flex;align-items:center;gap:8px}
.d1 .esg-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;text-align:center}
.d1 .esg-box.highlight{background:var(--green-l);border-color:rgba(26,92,56,.2)}
.d1 .esg-box.bridge{background:var(--blue-l);border-color:rgba(26,63,138,.2)}
.d1 .esg-box.risk{background:var(--amber-l);border-color:rgba(168,96,24,.2)}
.d1 .esg-label{font-size:8px;font-weight:600;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.d1 .esg-val{font-size:16px;font-weight:700;color:var(--ink)}
.d1 .esg-sub{font-size:9px;color:var(--ink3);margin-top:2px}
.d1 .esg-arrow{font-size:16px;color:var(--border);flex-shrink:0}
/* table */
.d1 .tw{border-radius:var(--r);overflow:hidden;background:white;border:1px solid var(--border)}
.d1 .th{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.d1 .tt{font-size:9px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.d1 table{width:100%;border-collapse:collapse;font-size:11px}
.d1 thead th{text-align:left;padding:7px 10px;color:var(--ink3);font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--bg)}
.d1 td{padding:8px 10px;color:var(--ink2);border-top:1px solid var(--bg)}
.d1 td:first-child{color:var(--ink);font-weight:500}
.d1 .dp{color:var(--red);font-weight:600}
.d1 .dn{color:var(--green);font-weight:600}
.d1 .dbench{color:var(--ink3)}
/* assessment */
.d1 .uj-row{background:var(--blue-l);border:1px solid rgba(26,63,138,.15);border-radius:var(--r);padding:12px 14px;margin-bottom:11px}
.d1 .uj-t{font-size:9px;font-weight:600;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.d1 .uj-flow{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--ink2)}
.d1 .uj-step{background:white;border:1px solid var(--border);border-radius:6px;padding:6px 9px;text-align:center;flex:1}
.d1 .uj-step.fin{background:var(--green-l);border-color:rgba(26,92,56,.15)}
.d1 .uj-icon{font-size:11px;margin-bottom:2px}
.d1 .uj-title{font-weight:600;color:var(--ink);font-size:10px}
.d1 .uj-title.green{color:var(--green)}
.d1 .uj-sub{color:var(--ink3);font-size:9px;margin-top:1px}
.d1 .uj-arrow{color:var(--border);font-size:14px}
.d1 .fom{background:var(--blue-l);border:1px solid rgba(26,63,138,.15);border-radius:var(--r);padding:13px 15px;margin-bottom:11px}
.d1 .fom-t{font-size:10px;font-weight:600;color:var(--blue);margin-bottom:3px}
.d1 .fom-d{font-size:9px;color:var(--ink3);margin-bottom:9px;line-height:1.5}
.d1 .fom-q{font-size:10px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.d1 .fom-scale{display:flex;gap:5px}
.d1 .fom-btn{flex:1;padding:7px 4px;border-radius:7px;border:1px solid var(--border);background:white;font-size:9px;font-weight:500;color:var(--ink3);cursor:pointer;text-align:center;font-family:inherit;transition:all .15s}
.d1 .fom-btn:hover{border-color:var(--blue);color:var(--blue)}
.d1 .fom-btn.sel{background:var(--blue-l);border-color:rgba(26,63,138,.3);color:var(--blue);font-weight:600}
.d1 .ag{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.d1 .fc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:15px 17px}
.d1 .fct{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:3px}
.d1 .fcd{font-size:10px;color:var(--ink3);line-height:1.55;margin-bottom:11px}
.d1 .lr{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 11px;margin-bottom:8px;font-size:10px;color:var(--ink3);font-family:monospace}
.d1 .cb{font-size:10px;font-weight:600;color:var(--green);background:var(--green-l);border:1px solid rgba(26,92,56,.15);border-radius:4px;padding:3px 9px;cursor:pointer;font-family:inherit}
.d1 .sm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.d1 .smi{background:var(--bg);border-radius:7px;padding:6px 9px;text-align:center}
.d1 .smv{font-size:13px;font-weight:700;color:var(--ink)}
.d1 .sml{font-size:9px;color:var(--ink3);margin-top:1px}
.d1 .uc{background:white;border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.d1 .ug{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.d1 .uz{border:1.5px dashed var(--border);border-radius:9px;padding:16px 12px;text-align:center;cursor:pointer}
.d1 .uz:hover{border-color:var(--green);background:var(--green-l)}
.d1 .uzi{font-size:17px;margin-bottom:5px}
.d1 .uzt{font-size:11px;font-weight:500;color:var(--ink2);margin-bottom:2px}
.d1 .uzs{font-size:9px;color:var(--ink3)}
.d1 .ib{border-radius:9px;padding:12px 14px;background:var(--green-l);border:1px solid rgba(26,92,56,.12);margin-bottom:11px}
.d1 .ibt{font-size:10px;font-weight:600;color:var(--green);margin-bottom:3px}
.d1 .ibd{font-size:10px;color:#1A4A2E;line-height:1.65}
/* auth */
.d1 .aw{min-height:640px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:36px}
.d1 .ac{background:white;border:1px solid var(--border);border-radius:18px;padding:32px;width:380px;box-shadow:0 8px 36px rgba(0,0,0,.07)}
.d1 .alo{display:flex;align-items:center;gap:10px;margin-bottom:18px;justify-content:center}
.d1 .alo .m{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1A5C38,#1A3F8A);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white}
.d1 .alo .n{font-size:17px;font-weight:600;color:var(--ink)}
.d1 .at{font-family:'IBM Plex Serif',serif;font-size:20px;color:var(--ink);text-align:center;margin-bottom:3px;font-weight:500}
.d1 .as{font-size:11px;color:var(--ink3);text-align:center;margin-bottom:20px}
.d1 .fi{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--ink);font-family:inherit;outline:none;margin-bottom:9px}
.d1 .fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.d1 .fsec{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:12px 0 9px;padding-top:12px;border-top:1px solid var(--border)}
.d1 .btnp{width:100%;background:linear-gradient(135deg,#1A5C38,#1A3F8A);color:white;border:none;border-radius:9px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.d1 .af{text-align:center;font-size:10px;color:var(--ink3);margin-top:12px}
.d1 .af a{color:var(--green);text-decoration:none;font-weight:500}
/* settings */
.d1 .sblock{background:white;border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:10px}
.d1 .sbt{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:2px}
.d1 .sbd{font-size:10px;color:var(--ink3);margin-bottom:11px}
.d1 .srowx{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bg)}
.d1 .srowx:last-child{border-bottom:none;padding-bottom:0}
.d1 .sk{font-size:11px;color:var(--ink2)}
.d1 .sv2{font-size:10px;color:var(--ink3)}
.d1 .se{font-size:10px;color:var(--green);cursor:pointer;font-weight:500}
.d1 .tog{width:32px;height:18px;background:linear-gradient(135deg,#1A5C38,#1A3F8A);border-radius:9px;position:relative;cursor:pointer}
.d1 .tog::after{content:'';position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:3px;right:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.d1 .foot{margin-top:14px;display:flex;align-items:center;justify-content:space-between}
.d1 .flab{font-size:10px;color:rgba(255,255,255,.25)}
.d1 .dots{display:flex;gap:5px}
.d1 .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer}
.d1 .dot.on{background:var(--green)}

/* ════ DESIGN 2 — LIQUID DARK (iOS26 glass) ═══ */
.d2{background:#040810;position:relative;font-family:'Inter',sans-serif;
  --bg:rgba(255,255,255,.045);--ink:rgba(255,255,255,.95);--ink2:rgba(255,255,255,.6);--ink3:rgba(255,255,255,.3);
  --green:#30d158;--green-l:rgba(48,209,88,.1);--blue:#0a84ff;--blue-l:rgba(10,132,255,.1);
  --red:#ff453a;--red-l:rgba(255,69,58,.1);--amber:#ff9f0a;--amber-l:rgba(255,159,10,.1);

function go(d, screen) {
  const cont = document.getElementById('design-' + d)
  const theme = THEMES[d]
  cont.querySelector('.win').innerHTML = ''
  let html = ''
  if (d === 2) html += '<div class="wchrome"><div class="tl-row"><div class="tl tl-r"></div><div class="tl tl-y"></div><div class="tl tl-g"></div></div><div class="wt">HQ Code · hqcode.app</div></div>'
  if (screen === 'dashboard') html += buildDashboard(d, theme)
  else if (screen === 'assessment') html += buildAssessment(d, theme)
  else if (screen === 'hrmetrics') html += buildHRMetrics(d, theme)
  else if (screen === 'financial') html += buildFinancial(d, theme)
  else if (screen === 'signup') html += buildSignup(d)
  else if (screen === 'login') html += buildLogin(d)
  else if (screen === 'settings') html += buildSettings(d, theme)
  cont.querySelector('.win').innerHTML = html

  // Update nav pills
  const pills = cont.querySelectorAll('.np')
  pills.forEach((p, i) => p.classList.toggle('on', SCREENS[i] === screen))
  // Update dots
  const dots = cont.querySelectorAll('.dot')
  dots.forEach((dt, i) => dt.classList.toggle('on', SCREENS[i] === screen))
  // Update footer label
  const lbl = cont.querySelector('.flab')
  if (lbl) lbl.textContent = LABELS[screen] || screen
}

function switchD(n) {
  document.querySelectorAll('.design').forEach(el => el.classList.remove('on'))
  document.querySelectorAll('.ds-tab').forEach(t => t.classList.remove('on'))
  document.getElementById('design-' + n).classList.add('on')
  document.querySelectorAll('.ds-tab')[n-1].classList.add('on')
  const info = {1:'Design 1 · IBM Plex Sans · Professional, trustworthy',2:'Design 2 · iOS26 Liquid Glass · Modern, premium',3:'Design 3 · Comfort Therapy · Lavender + Sage · Research-backed calm'}
  document.getElementById('ds-info').textContent = info[n]
  go(n, 'dashboard')
}
